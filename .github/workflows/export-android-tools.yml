name: Export Android Build Tools

on:
  push:
    branches:
      - kittens-hud-ironwill-app
    paths:
      - '.github/workflows/export-android-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline
          mv /tmp/android-cmdline/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          mkdir -p export-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" export-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" export-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" export-tools/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35-signing
          path: export-tools
          if-no-files-found: error
          retention-days: 1
