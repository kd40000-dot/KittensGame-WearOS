name: Test Kittens Live Sync

on:
  push:
    branches:
      - live-sync-realtime
    paths:
      - "live-sync/**"
      - ".github/workflows/live-sync-tests.yml"
  pull_request:
    paths:
      - "live-sync/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
