name: Test Kittens Live Sync

on:
  push:
    branches:
      - live-sync-realtime
    paths:
      - "live-sync/**"
      - "sync/live-sync-client.js"
      - "phone/live-sync-phone.js"
      - "phone/live-sync-ui.js"
      - "sync/live-sync-client.js"
      - "phone/live-sync-phone.js"
      - "phone/live-sync-ui.js"
      - "phone/plan-a-phone.js"
      - ".github/workflows/live-sync-tests.yml"
  pull_request:
    paths:
      - "live-sync/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - name: Cloudflare Worker dry run
        run: npx wrangler deploy --dry-run --outdir=dist
      - name: Verify deployed Live Sync endpoint
        working-directory: .
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 https://kittens-live-sync.alike-fog.workers.dev/health | tee /tmp/live-health.json
          grep -q '"ok":true' /tmp/live-health.json
      - name: Browser client syntax
        working-directory: .
        run: |
          node --check sync/live-sync-client.js
          node --check phone/live-sync-phone.js
          node --check phone/live-sync-ui.js
          node --check phone/plan-a-phone.js
