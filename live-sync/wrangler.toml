name = "kittens-live-sync"
main = "src/index.js"
compatibility_date = "2026-11-01"

[durable_objects]
bindings = [
  { name = "KITTENS_SESSION", class_name = "KittensSession" },
  { name = "PAIR_REGISTRY", class_name = "PairRegistry" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KittensSession", "PairRegistry"]
